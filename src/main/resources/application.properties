# Database - Neon provides postgresql:// format, Spring needs jdbc:postgresql://
spring.datasource.url=jdbc:postgresql://${DB_HOST}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server
server.port=${PORT:8080}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Anthropic
anthropic.api.key=${ANTHROPIC_API_KEY:placeholder}

# File upload limits (for document-to-flashcard extraction)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Admin credentials — set ADMIN_USERNAME and ADMIN_PASSWORD as environment variables
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD}