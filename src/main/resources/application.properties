# Database - Neon provides postgresql:// format, Spring needs jdbc:postgresql://
spring.datasource.url=jdbc:postgresql://${DB_HOST}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server
server.port=${PORT:8080}

# JWT
jwt.secret=${JWT_SECRET:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7e3d90d31e05cdf5cf5a68de61}
jwt.expiration=86400000

# Anthropic
anthropic.api.key=${ANTHROPIC_API_KEY:placeholder}